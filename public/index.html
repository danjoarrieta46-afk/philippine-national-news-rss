<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Philippine National News RSS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f5f7fa;
      color: #222;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .feed {
      display: inline-block;
      background: #f97316;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    code {
      background: #eee;
      padding: 4px 7px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🇵🇭 Philippine National News</h1>

    <p>
      Automatically updated Philippine national news
      from multiple news organizations.
    </p>

    <p>
      <a class="feed" href="/feed.xml">
        Open RSS Feed
      </a>
    </p>

    <h2>RSS URL</h2>

    <p>
      <code>/feed.xml</code>
    </p>

    <h2>News Sources</h2>

    <ul>
      <li>GMA News</li>
      <li>ABS-CBN News</li>
      <li>Inquirer</li>
      <li>Philstar</li>
      <li>Manila Bulletin</li>
      <li>Manila Times</li>
      <li>BusinessWorld</li>
      <li>SunStar</li>
      <li>PNA</li>
    </ul>

  </div>

</body>
</html>
